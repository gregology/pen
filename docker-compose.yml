# AI Penetration Testing Platform — V1
# Deployed as a Portainer stack on host01 (env 16). Custom images are
# built on the host (Portainer's `build:` works from a stale creation-time
# snapshot of the repo — see IMPLEMENTATION-V1.md):
#   git -C /home/user/pen pull
#   docker build -t pen/vpn-gateway:v1 /home/user/pen/images/vpn-gateway
#   docker build -t pen/agent:v1       /home/user/pen/images/agent
# Secrets are supplied via Portainer stack environment variables — never here.
#
# All state lives in host paths under /home/user/pen (create before deploy):
#   /home/user/pen/vpn-configs/   WireGuard .conf files, one per exit node (chmod 600)
#   /home/user/pen/llm-logs/      LLM proxy audit log output
#   /home/user/pen/dsh-data/      agent workspace / DSH state
#
# These paths live inside the repo checkout on the host; .gitignore is
# what keeps vpn-configs (private keys) and llm-logs (sensitive
# request/response bodies) out of commits. Do not remove it.

name: pen

networks:
  # Agent <-> gateways only. `internal: true` = no external route exists here.
  # Subnets are pinned so the kill switch's CIDR allow rules are static
  # config, not deploy-time discovery.
  sandbox:
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
  # Gateways <-> internet/LAN. Only the two gateway containers are attached.
  # llm-proxy reaches providers over this, including gaming-rig on the LAN.
  egress:
    ipam:
      config:
        - subnet: 172.31.0.0/24

services:

  # ------------------------------------------------------------------
  # VPN gateway: sole egress for attack traffic. Owns the kill switch
  # and the exit-node control API. The agent shares its network
  # namespace, so this container's iptables IS the agent's perimeter.
  # ------------------------------------------------------------------
  vpn-gateway:
    # Pre-built on the host (docker build -t pen/vpn-gateway:v1
    # /home/user/pen/images/vpn-gateway). Portainer's `build:` support
    # clones stale snapshots into its own project dir; host-built images
    # are the house convention for custom images.
    image: pen/vpn-gateway:v1
    pull_policy: never
    container_name: vpn-gateway
    cap_add:
      - NET_ADMIN          # required for wg-quick + iptables
    # /proc/sys is read-only in containers; wg-quick requires
    # src_valid_mark=1 for its policy routing, so Docker sets it here
    # (the image's sysctl shim satisfies wg-quick's redundant write).
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    devices:
      - /dev/net/tun:/dev/net/tun
    networks:
      - sandbox            # agent + llm-proxy reach it here
      - egress             # encrypted tunnel leaves via here; kill switch
                           # blocks everything else on this interface
    # Containers sharing this namespace also share its /etc/hosts, so this
    # entry serves the agent: embedded DNS can resolve llm-proxy to its
    # egress IP, which the kill switch rightly blocks. This pins the name
    # to the sandbox path.
    extra_hosts:
      - "llm-proxy:172.30.0.3"
    volumes:
      # WireGuard configs contain private keys — chmod 600, gitignored,
      # never committed.
      - /home/user/pen/vpn-configs:/vpn/configs:ro
    environment:
      - VPN_API_TOKEN=${VPN_API_TOKEN}
      - VPN_API_PORT=8080
      - SANDBOX_CIDR=172.30.0.0/24   # must match the sandbox subnet above
      - EGRESS_CIDR=172.31.0.0/24    # must match the egress subnet above
      - LAN_CIDR=10.0.0.0/24         # household LAN; GUI is reachable from here
      - DNS_SERVERS=1.1.1.1 9.9.9.9  # must match `dns:` below
    # Pinned resolvers so the kill switch can permit exactly these. If the
    # VPN provider forces its own DNS (some block third-party port 53),
    # use the provider's resolver IPs here and in DNS_SERVERS instead.
    dns:
      - 1.1.1.1
      - 9.9.9.9
    ports:
      # DSH web GUI. Published HERE because the agent shares this
      # namespace. dsh refuses to bind 0.0.0.0 by design, so a socat
      # forwarder in the gateway bridges this port to the agent's
      # loopback listener. Bound to the LAN address only: reachable as
      # http://10.0.0.10:3080, closed on the host's other interfaces.
      - "10.0.0.10:3080:3080"
      # code-server, same pattern (forwarder → agent's loopback :8081).
      - "10.0.0.10:3081:3081"
    healthcheck:
      # "Healthy" = kill switch applied and API up (tunnel may still be
      # connecting; the API reports that in /status). CMD-SHELL because
      # the token must be expanded in the container — CMD would pass the
      # literal string "$VPN_API_TOKEN" to curl and 401 forever.
      test: ["CMD-SHELL", "curl -fsS -H \"Authorization: Bearer $${VPN_API_TOKEN}\" http://localhost:8080/status"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ------------------------------------------------------------------
  # Agent: DeepSeek Harness + pentest toolchain. No networks of its own,
  # no published ports — it lives entirely inside the vpn-gateway
  # namespace. Its only peers are llm-proxy and the gateway API.
  # ------------------------------------------------------------------
  agent:
    # Pre-built on the host, same convention as vpn-gateway.
    image: pen/agent:v1
    pull_policy: never
    container_name: agent
    network_mode: service:vpn-gateway
    # Root uid keeps the toolchain intact — nmap's SYN/UDP scans and OS
    # detection need real root, and Docker does not give ambient
    # capabilities to a non-root process. gid 1000 with umask 002 in the
    # entrypoint makes everything written under /working group-writable
    # for Greg's host user, so the shared directory needs no sudo.
    user: "0:1000"
    depends_on:
      vpn-gateway:
        condition: service_healthy   # never start before the kill switch
    environment:
      # All LLM traffic goes to the proxy over the sandbox network.
      # The agent is configured with a single "llm-proxy" provider; model
      # IDs are the namespaced aliases from litellm/config.yaml
      # (e.g. kimi-coding/k3, zai/glm-5.3, gaming-rig/qwen38-27b).
      - OPENAI_BASE_URL=http://llm-proxy:4000/v1
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY}   # proxy key, NOT a provider key
      # VPN control API — same namespace, so plain localhost.
      - VPN_API_URL=http://localhost:8080
      - VPN_API_TOKEN=${VPN_API_TOKEN}
      # code-server login. Unset means code-server generates one into
      # /home/user/pen/dsh-data/code-server/config.yaml.
      - CODE_SERVER_PASSWORD=${CODE_SERVER_PASSWORD}
      # DSH's bash sandbox is bubblewrap-backed, and bwrap cannot create
      # namespaces inside this container without --privileged (tested:
      # plain, seccomp=unconfined, SYS_ADMIN, SYS_ADMIN+apparmor all
      # denied). Unconfined bash inside the container preserves the
      # platform's actual boundary, which is the network topology.
      - DSH_PERMISSION_MODE=danger-full-access
    volumes:
      - /home/user/pen/dsh-data:/data
      # Shared with the host: AGENTS.md, test notes, anything Greg and
      # the agent both edit. Also the code-server workspace.
      - /home/user/pen/working:/working
      # Per-tool operator documentation, read-only. A separate mount rather
      # than a symlink under working/: a link would resolve against the
      # container's filesystem, where the host repo path does not exist.
      - /home/user/pen/tools:/working/tools:ro
    restart: unless-stopped

  # ------------------------------------------------------------------
  # LLM proxy: sole path to LLM providers. Holds the provider keys so
  # the agent never sees them, and writes the full request/response
  # audit log to a host path the agent cannot touch.
  # ------------------------------------------------------------------
  llm-proxy:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: llm-proxy
    networks:
      # Sandbox IP pinned: the agent's extra_hosts entry points here.
      sandbox:
        ipv4_address: 172.30.0.3
      egress:              # provider calls leave directly (no VPN —
                           # authenticated API traffic, per DESIGN.md).
                           # gaming-rig (10.0.0.21) is reached on the LAN
                           # via the host's route from this bridge.
    volumes:
      - /home/user/pen/litellm/config.yaml:/app/config.yaml:ro
      - /home/user/pen/litellm/custom_callbacks.py:/app/custom_callbacks.py:ro
      - /home/user/pen/llm-logs:/logs
    command: ["--config", "/app/config.yaml", "--host", "0.0.0.0", "--port", "4000"]
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - KIMI_CODING_API_KEY=${KIMI_CODING_API_KEY}
      - ZAI_API_KEY=${ZAI_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - GAMING_RIG_API_KEY=${GAMING_RIG_API_KEY}
    healthcheck:
      # The LiteLLM image has no curl; its own venv python does the probe.
      test: ["CMD-SHELL", "/app/.venv/bin/python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\""]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
